<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="270" viewBox="0 0 1500 270" role="img" aria-labelledby="title desc">
<title id="title">Implemented human feedback workflow</title>
<desc id="desc">The user reviews the displayed assessment, responds to the machine recommendation, and the system stores one response with a timestamp per run and updates Findings. Alignment is the proportion of agreement among agreement and disagreement responses.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<rect x="30" y="40" width="330" height="190" fill="white" stroke="#202020" stroke-width="1.8"/><text x="195" y="83" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Review assessment</text><text x="195" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">Recommendation shown</text><text x="195" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">with supporting outputs</text><path d="M 360 135 H 400" fill="none" stroke="#202020" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="400" y="40" width="330" height="190" fill="white" stroke="#202020" stroke-width="1.8"/><text x="565" y="83" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Human response</text><text x="565" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">Agree / discuss / disagree</text><text x="565" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">Relative to recommendation</text><path d="M 730 135 H 770" fill="none" stroke="#202020" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="770" y="40" width="330" height="190" fill="white" stroke="#202020" stroke-width="1.8"/><text x="935" y="83" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Record decision</text><text x="935" y="135" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">One response per run</text><text x="935" y="173" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202020">Response and timestamp</text><path d="M 1100 135 H 1140" fill="none" stroke="#202020" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="1140" y="40" width="330" height="190" fill="white" stroke="#202020" stroke-width="1.8"/><text x="1305" y="83" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202020">Update Findings</text><text x="1305" y="123" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#202020">Human–machine alignment</text><text x="1305" y="157" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#202020">Agree / (agree + disagree)</text><text x="1305" y="191" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#202020">Discuss / pending excluded</text></svg>