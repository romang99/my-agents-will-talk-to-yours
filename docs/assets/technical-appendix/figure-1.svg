y</tspan><tspan x="862.5" dy="33.75">judgments</tspan></text><text x="862.5" y="579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="862.5" dy="0">Valid votes</tspan></text><text x="710" y="542" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#202020"><tspan x="710" dy="0">OR</tspan></text><rect x="500" y="657" width="420" height="54" fill="white" stroke="#202020" stroke-width="1.8"/><text x="710" y="692" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="710" dy="0">ECP computed in code</tspan></text><path d="M 557.5 605 V 630 H 640 V 657" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M 862.5 605 V 630 H 780 V 657" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M 300 165 H 410" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M 300 393 H 410" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><path d="M 350 393 V 244 H 410" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><circle cx="350" cy="393" r="3.1" fill="#202020"/><path d="M 300 660 H 410" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="1130" y="135" width="340" height="300" fill="white" stroke="#202020" stroke-width="1.8"/><text x="1300" y="176" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">Result assembly</tspan></text><path d="M 1130 197 H 1470" fill="none" stroke="#202020" stroke-width="1.2" stroke-linejoin="miter"/><text x="1300" y="233" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">Rule-based classification</tspan><tspan x="1300" dy="32.400000000000006">from S and ECP</tspan></text><path d="M 1150 295 H 1450" fill="none" stroke="#A0A0A0" stroke-width="1.0" stroke-linejoin="miter"/><text x="1300" y="332" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">LLM explanation</tspan><tspan x="1300" dy="32.400000000000006">of structural mechanisms</tspan></text><text x="1300" y="405" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#616161" font-style="italic"><tspan x="1300" dy="0">Separate operations</tspan></text><path d="M 1010 195 H 1065 V 295" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter"/><path d="M 1010 684 H 1065 V 295" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter"/><circle cx="1065" cy="295" r="3.1" fill="#202020"/><path d="M 1065 295 H 1130" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="1130" y="505" width="340" height="115" fill="white" stroke="#202020" stroke-width="1.8"/><text x="1300" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">Recommendation, class</tspan><tspan x="1300" dy="32.400000000000006">and explanations shown</tspan></text><path d="M 1300 435 V 505" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><rect x="1130" y="685" width="340" height="115" fill="white" stroke="#202020" stroke-width="1.8"/><text x="1300" y="723" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">Human feedback</tspan></text><text x="1300" y="757" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#202020"><tspan x="1300" dy="0">Agree / discuss / disagree</tspan><tspan x="1300" dy="29.700000000000003">After results are shown</tspan></text><path d="M 1300 620 V 685" fill="none" stroke="#202020" stroke-width="1.8" stroke-linejoin="miter" marker-end="url(#arrow)"/><text x="30" y="855" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#616161"><tspan x="30" dy="0">Arrows indicate logical information flow. The two assessment modes provide distinct operationalisations of ECP.</tspan></text></svg>