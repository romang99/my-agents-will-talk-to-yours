<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="875" viewBox="0 0 1500 875" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Implemented pair-assessment workflow</title>
<desc id="fig-desc">Logical information flow in the implemented ResearcherConnect prototype. Researcher profiles and a known collaboration graph feed a deterministic structural baseline. Profiles and an optional opportunity trigger feed one of two model assessment modes: persona dialogue followed by synthesis, or repeated binary judgments. ECP is computed in code from the selected mode. Baseline and model outputs support rule-based classification and a separate LLM explanation of structural mechanisms. Recommendation, class and explanations are displayed before human feedback is recorded.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/></marker>
</defs>
